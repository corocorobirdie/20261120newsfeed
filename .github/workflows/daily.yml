name: daily-feed

on:
  # GitHub の定時実行は混雑時に遅れたり飛ばされたりするため、混みにくい半端な時刻にし、
  # 予備の時刻にも起動する（その日の分がすでにできていれば何もしない）
  schedule:
    - cron: "47 21 * * *"  # 6:47 JST
    - cron: "37 22 * * *"  # 7:37 JST（予備）
    - cron: "37 23 * * *"  # 8:37 JST（予備）
    - cron: "7 1 * * *"    # 10:07 JST（予備）
  workflow_dispatch:       # Actions 画面から手動実行もできる
    inputs:
      site_only:
        description: "サイトだけ作り直す（論文の取得・Gemini は使わない）"
        type: boolean
        default: false

permissions:
  contents: write   # data/ をコミットして残すため
  pages: write
  id-token: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  # 予備の時刻の起動では、その日の分がすでにあれば以降を飛ばす（手動実行は常に実行）
  gate:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: data/index.json
      - id: check
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"latest\": \"$today\"" data/index.json 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "今日($today)の分は作成済みのため何もしない"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, score, summarize
        if: ${{ !inputs.site_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m feed.run

      - name: Build site only
        if: ${{ inputs.site_only }}
        run: python -m feed.build

      - name: Commit data
        if: ${{ !inputs.site_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
