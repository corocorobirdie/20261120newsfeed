name: daily-feed

on:
  schedule:
    - cron: "0 22 * * *"   # 毎朝 7:00 JST（GitHub の混雑で数十分遅れることがあります）
  workflow_dispatch:       # Actions 画面から手動実行もできる
    inputs:
      site_only:
        description: "サイトだけ作り直す（論文の取得・Gemini は使わない）"
        type: boolean
        default: false

permissions:
  contents: write   # data/ をコミットして残すため
  pages: write
  id-token: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, score, summarize
        if: ${{ !inputs.site_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m feed.run

      - name: Build site only
        if: ${{ inputs.site_only }}
        run: python -m feed.build

      - name: Commit data
        if: ${{ !inputs.site_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
