name: check-feeds

# tools/feeds_to_check.txt を変更して push すると、各 RSS が取得できるかを確認し、
# 結果を feed-check ブランチの result.txt に保存する（サイトや毎日のデータには影響しない）
on:
  push:
    branches: [main]
    paths: [tools/feeds_to_check.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests feedparser
      - run: python tools/check_feeds.py tools/feeds_to_check.txt > /tmp/result.txt; cat /tmp/result.txt
      - name: Save result to feed-check branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan feed-check
          git rm -rfq .
          cp /tmp/result.txt result.txt
          git add result.txt
          git commit -qm "feed check $(date -u +%FT%TZ)"
          git push -f origin feed-check
