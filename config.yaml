# 全体設定（自由に変更してOK）

timezone: Asia/Tokyo

gemini:
  # 使うモデルを上から順に試す（使えない・応答しない・1日の枠切れなら次へ）。
  # 2026-11 時点で確認: gemini-2.5-flash は新規ユーザー向けに提供終了、
  # gemini-3.8-flash は応答が返らず、gemini-3-flash-preview は大量の採点でタイムアウト。
  # 最新のモデル名は AI Studio（aistudio.google.com）で確認して書き換えてください。
  # 採点は件数が多いので軽いモデル、要約は質が大事なので上位モデルを先に使う
  # （上位モデルは1日の無料枠が小さいため）
  score_models:
    - gemini-3.1-flash-lite
    - gemini-3-flash-preview
    - gemini-3.5-flash
  summary_models:
    - gemini-3.5-flash
    - gemini-3-flash-preview
    - gemini-3.1-flash-lite
  timeout_sec: 150
  score_batch_size: 30        # 採点は30件ずつまとめて1回で送る
  summary_batch_size: 8       # 要約は8件ずつまとめて1回で送る
  min_interval_sec: 13        # 呼び出し間隔（無料枠の毎分上限対策。上位モデルは毎分5回程度のことがある）
  max_retries: 4
  temperature: 0.2

papers:
  lookback_days: 7            # arXiv / ジャーナルの新着を何日さかのぼるか（既出は除くので長めでよい。arXiv は公開が投稿より遅れる）
  author_lookback_days: 30    # 著者別新着（OpenAlex）の範囲
  group_c_weekday: 0          # グループC（新着まれ）を取得する曜日 0=月曜
  min_score: 5                # これ未満は表示しない（グループAは例外）
  group_b_min_score: 6        # グループBの表示基準（加点後）
  group_b_bonus: 2            # グループB著者の加点
  summarize_top: 40           # 日本語要約を付ける件数（表示する全件）
  max_display: 40             # 1日に表示する最大件数

# 「Claudeに聞く」ボタンの飛び先。
# url が既定、tabs でタブごとに変えられる。空なら新しいチャット。
# プロジェクトに飛ばすなら、そのプロジェクトを開いたときのアドレス（https://claude.ai/project/… ）を書く。
# どちらの場合も、質問文はクリップボードにもコピーされる（入力されていなければ貼り付け）。
ask_claude:
  url: "https://claude.ai/project/01a1f89a-cdbd-70d7-b2a6-f59a93d681b3"     # 既定（時事・兆し・今後のタブ）
  tabs:
    papers: "https://claude.ai/project/01a1f878-bad5-71bf-8bad-166d348dfda2"      # newsfeed_QA
    inequality: "https://claude.ai/project/01a1f878-bad5-71bf-8bad-166d348dfda2"  # newsfeed_QA

highlights: 5                 # 今日のハイライト件数

retention:
  news_days: 60               # ニュースは60日分だけ残す（論文は papers.jsonl に全件残る）
