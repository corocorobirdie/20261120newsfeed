# 注目著者リスト
#
# openalex: OpenAlex の著者ID（同姓同名の取り違えを防ぐため、名前ではなくIDで登録）。
#           OpenAlex 側で1人が複数のプロフィールに分かれている場合は複数書く。
#           IDは https://openalex.org/authors/A5004468202 のように開くと確認できます。
# name_search: OpenAlex で著者IDが付いていない人向け。名前で検索する（fields で分野を絞る）。
# fields: OpenAlex の分野IDで絞り込む（20=経済学, 12=人文学(哲学を含む), 33=社会科学）。
#         別人の論文が混ざったプロフィール向け。
# arxiv: arXiv の著者検索に使う名前（econ / cs.GT / math などのカテゴリに限定して検索）。
# check: 自動特定に不安がある項目（ユーザーに確認したいもの）。
#
# グループ A: 必ず表示（★付き） / B: 関連度で絞る（加点あり） / C: 新着まれ（週1回取得）

