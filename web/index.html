<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<title>Morning Feed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morning Feed">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Morning Feed</h1>
    <div class="datenav">
      <button id="prev" aria-label="前の日">‹</button>
      <span id="date">—</span>
      <button id="next" aria-label="次の日">›</button>
    </div>
    <button id="search-toggle" class="icon" aria-label="検索・絞り込み" aria-expanded="false">⌕</button>
    <button id="theme" class="icon" aria-label="表示モード切替">◐</button>
  </div>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div id="filterbar" class="filterbar" hidden>
    <input id="q" type="search" placeholder="キーワードで絞り込み" autocomplete="off" enterkeyhint="search">
    <div id="active-filters" class="active-filters"></div>
  </div>
</header>

<main>
  <section id="today-canon" class="today-canon" hidden></section>
  <section id="highlights" class="highlights" hidden>
    <h2>今日のハイライト</h2>
    <ol id="hl-list"></ol>
  </section>
  <div id="meta" class="meta"></div>
  <div id="list" class="list"></div>
  <footer class="foot"><button id="open-settings" type="button">設定</button></footer>
</main>

<dialog id="settings">
  <form method="dialog">
    <h2>設定</h2>
    <label for="proxy">大学経由で開くための入口アドレス</label>
    <input id="proxy" type="url" inputmode="url" autocomplete="off" placeholder="https://〇〇.idm.oclc.org/login?url=">
    <p class="hint">設定すると、論文の「開く」が大学のプロキシ経由になります（DOI のある論文のみ）。このアドレスはこの端末と、同期を設定した場合は自分の Google ドライブにだけ保存され、サイトやリポジトリには公開されません。空にすると解除。</p>
    <h3>端末間の同期</h3>
    <p class="hint">しおり・文献の把握度・上の設定を、自分の Google ドライブ経由でほかの端末と揃えます。</p>
    <label for="sync-url">同期アドレス（Apps Script の Web アプリの URL）</label>
    <input id="sync-url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="sync-token">合言葉</label>
    <input id="sync-token" type="text" autocomplete="off" spellcheck="false">
    <p class="hint" id="sync-status"></p>
    <button id="copy-sync-link" type="button" class="secondary" hidden>ほかの端末用の同期リンクをコピー</button>
    <div class="dialog-actions">
      <button value="cancel" type="submit" class="secondary">閉じる</button>
      <button value="save" type="submit" id="save-settings">保存</button>
    </div>
  </form>
</dialog>

<template id="card-tpl">
  <article class="card">
    <div class="badges"></div>
    <h3 class="title-ja"><a target="_blank" rel="noopener"></a></h3>
    <ul class="summary"></ul>
    <p class="reason"></p>
    <p class="orig-title"></p>
    <p class="byline"></p>
    <p class="src"></p>
    <div class="tags"></div>
    <div class="actions">
      <button class="bookmark" type="button" aria-pressed="false" aria-label="保存">🔖</button>
      <button class="toggle-orig" type="button">原文を表示</button>
      <a class="ask" target="_blank" rel="noopener">Claudeに聞く</a>
      <a class="open" target="_blank" rel="noopener">開く ↗</a>
    </div>
    <div class="orig" hidden></div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
