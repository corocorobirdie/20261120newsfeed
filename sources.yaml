# 情報源の一覧。行を追加・削除すれば反映されます。
#
# ジャーナルの取得方法:
#   Springer と Cambridge は自動取得（RSS）を拒否するため、全誌を Crossref API
#   （DOI登録情報。即日反映・無料・キー不要）で ISSN を指定して取得しています。
#   要旨が Crossref にない場合は OpenAlex から補完します。

papers:
  interest: |
    社会選択理論・意思決定理論の理論研究に関心がある研究者。
    特に: social choice, preference aggregation, Arrow's theorem, welfare economics,
    fairness, decision theory, expected utility, ambiguity / uncertainty, rationality,
    population ethics, axiomatization, inequality measurement, poverty measurement,
    polarization measurement。
    キーワードに完全一致しなくても意味が近ければ高く評価する
    （例：公理的特徴づけ、社会厚生関数、選好の集計、不完備選好、非期待効用、世代間衡平）。
    応用ミクロ、マクロ、実証、産業組織、金融などの論文は低く評価する。

  tags: [社会選択, 意思決定, 不平等・貧困の測定, 厚生経済学, 公理化, 人口倫理, 投票, 公正・配分, ゲーム理論, メカニズムデザイン, その他]

  arxiv:
    - category: econ.TH
      keyword_filter: false     # econ.TH は全件を採点に回す
    - category: cs.GT
      keyword_filter: true      # cs.GT は本数が多いので、キーワードで事前に絞る
  arxiv_keywords: [social choice, voting, vote, preference, aggregation, arrow, welfare, fair, envy, axiom, characteriz, rational, utility, ambiguity, uncertainty, inequality, poverty, polarization, apportionment, dictator, impossibility, rank, ethic, justice, egalitarian, utilitarian]

  journals:
    # 専門誌
    - {name: Social Choice and Welfare,          issn: 0176-1714, openalex: S107325288, group: 専門誌}
    - {name: Theory and Decision,                issn: 0040-5833, openalex: S134979503, group: 専門誌}
    - {name: Economics & Philosophy,             issn: 0266-2671, openalex: S128223704, group: 専門誌}
    - {name: Mathematical Social Sciences,       issn: 0165-4896, openalex: S149064342, group: 専門誌}
    - {name: Journal of Public Economic Theory,  issn: 1097-3923, openalex: S184446198, group: 専門誌}
    # 理論系
    - {name: Journal of Economic Theory,         issn: 0022-0531, openalex: S149131268, group: 理論系}
    - {name: Games and Economic Behavior,        issn: 0899-8256, openalex: S94044085,  group: 理論系}
    - {name: Journal of Mathematical Economics,  issn: 0304-4068, openalex: S202934171, group: 理論系}
    - {name: Economic Theory,                    issn: 0938-2259, openalex: S579031,    group: 理論系}
    - {name: Theoretical Economics,              issn: 1933-6837, openalex: S10997704,  group: 理論系}

  # タイトルがこれに一致するものは論文ではないので除外
  exclude_title_patterns: ["^correction", "^erratum", "^corrigendum", "cover and front matter", "cover and back matter", "^editorial", "^issue information", "^front matter", "^back matter", "^retraction", "^publisher correction", "^call for papers", "^acknowledg"]


# ---------------------------------------------------------------- ニュース系タブ
# feeds の各項目:
#   name: 表示名 / url: RSS・Atom のアドレス / lang: en, ja など
#   label: カードに付けるラベル（例: 有料・見出しのみ）
#   headline_only: true なら本文の取得・要約をしない（有料記事など）
#   pinned: true なら採点に関係なく先頭に表示（Lobsterr など）
#   section: タブ内の欄（不平等タブ用）
# lookback_days: 何日前までの記事を対象にするか / show: 1日に表示する最大件数
# max_per_source: 1つの媒体から表示する最大件数（省略時は制限なし）
# summarize: 日本語要約を付ける件数 / min_score: これ未満は表示しない
# 2026-11 の確認結果:
#   ・NHK の RSS は 2026-08-08 で更新が止まり、新サイト(news.web.nhk)は認証が必要で取得不可 → 見送り
#   ・LSE International Inequalities Institute のブログは自動取得を拒否(403) → 見送り
#   ・Brookings の RSS は中身が空 → 見送り
#   ・The Browser の RSS は 2021 年で配信終了 → 見送り
#   ・Substack（Branko Milanovic, Lobsterr Letter）は GitHub のサーバーからの取得を拒否(403)する。
#     Google ニュースにも載らないため、Apps Script（Google のサーバー）経由で取る予定
#   ・ロシア・中国（2026-11 確認）: Caixin（拒否）・澎湃・聯合早報（RSSなし）・Re: Russia（RSSが空）は
#     Google ニュースのサイト指定検索で代替。新華社も日付付きで取れる Google ニュース経由にした
#   ・日経の公式な日本語 RSS は見つからず → Nikkei Asia（英語・公式）と、
#     日経の見出しを配信している非公式サービス（assets.wor.jp）を併用

news_tabs:
  inequality:
    reader: 読者は不平等・貧困の測定を専門とする経済学の研究者で、実証や政策の動向も追っています。
    interest: |
      所得・資産・機会の不平等、貧困、再分配、税制、社会保障、格差の測定と実証、
      世界の不平等の動向（World Inequality Database など）に関する研究・論考。
      理論の論文は論文タブで扱うので、ここでは実証・政策・データの話題を高く評価する。
      不平等や貧困と関係の薄いマクロ経済・金融・地政学の記事は低く評価する。
    tags: [不平等, 貧困, 再分配・税, 機会の平等, 測定・データ, 労働・賃金, 世界の動向, その他]
    lookback_days: 3
    min_score: 7
    # (a) 実証・政策系の論文（Crossref）。論文タブの「不平等・貧困の測定」タグの論文もここに表示する
    journals:
      - {name: Social Indicators Research,   issn: 0303-8300}
      - {name: Journal of Economic Inequality, issn: 1569-1721}
    papers_show: 10
    # (b) インフォーマルな記事
    feeds:
      - {name: World Inequality Lab (WID), url: "https://wid.world/news-article/feed/", lang: en}
      - {name: Branko Milanovic, url: "https://branko2f7.substack.com/feed", lang: en}
      - {name: VoxEU (CEPR), url: "https://cepr.org/rss/vox-content", lang: en}
      - {name: Project Syndicate, url: "https://www.project-syndicate.org/rss", lang: en}
      - {name: Our World in Data, url: "https://ourworldindata.org/atom.xml", lang: en}
      - {name: Equitable Growth, url: "https://equitablegrowth.org/feed/", lang: en}
    show: 10
    summarize: 10

  japan:
    reader: 読者は日本の政治・経済・社会の重要な動きを手短に把握したい研究者です。
    interest: |
      今日の日本で知っておくべき重要なニュース。政治・経済・政策・国際関係・社会の大きな動き、
      生活や研究に影響する制度変更を高く評価する。
      芸能・スポーツ・事件事故の続報・地域の小さな話題・企業の細かい人事や決算は低く評価する。
      同じ出来事を扱う記事が複数ある場合は、1つだけ高く評価する。
    tags: [政治, 経済, 国際, 社会, 科学・技術, 教育・研究, その他]
    lookback_days: 1
    min_score: 5
    max_per_source: 4           # 1つの媒体から表示する最大件数（媒体の偏りを防ぐ）
    feeds:
