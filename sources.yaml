      読み物として面白く視点が新しい記事を高く評価する。
      速報ニュース、単なる製品発表、広告的な記事、ありきたりな論評は低く評価する。
    tags: [カルチャー, テクノロジー, ビジネス, 社会, 都市・暮らし, 科学, アイデア, その他]
