      現代アートの重要な動きを高く評価する:
        ・世界の美術界の動向（大型展・ビエンナーレ、美術館の人事や方針、作家の重要な新作や回顧展、議論を呼んだ出来事、
          制度・政策・労働・返還などの論点、注目すべき批評や論考）
        ・日本の展覧会・美術館（とくに東京近辺で見に行ける、話題性や質の高い展覧会の開幕・レビュー、国内美術館の動き）
