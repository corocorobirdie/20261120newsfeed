  ruscn:
    reader: 読者はロシア極東・中国東北部（特にハルビン、アムール川流域、サハ共和国）の動向を追っている日本の研究者です。ロシアの地名・人名はカタカナ、中国の地名・人名は日本で通常使う漢字表記にしてください。
    interest: |
      ロシアと中国の重要な動き。とくに次の地域に関する記事を最も高く評価する:
        ・ハルビン、黒龍江省、黒河（中国東北部）
        ・アムール川流域（アムール州、ブラゴヴェシチェンスク、ハバロフスク地方）
        ・サハ共和国（ヤクーチア、ヤクーツク）
      ただし地域の記事でも、中身のあるもの（経済・投資・産業、政策・行政の決定、国境を越えた中露の
      交通・貿易・資源・人の往来、インフラ、極東開発、少数民族、環境・気候、社会問題）だけを高く評価し、
      天気予報、式典・記念行事・祝辞、表彰、文化イベントやスポーツ大会の告知、小さな事件事故は
      地域の記事であっても3点以下にする。
      地域以外では、ロシア・中国全体の政治・経済・社会の大きなニュースを6〜7点程度に評価する。
      同じ出来事を扱う記事が複数ある場合は、1つだけ高く評価する。
